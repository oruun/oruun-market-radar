# ORUUN Market Radar - Keyword Configuration
# Edit this file to change what the dashboard tracks. No code changes needed.
# After editing, commit & push; the next Actions run will pick it up.
#
# FOCUS: running APPAREL (tees, tanks, shorts, socks, caps).
# Shoes are intentionally excluded - that category is dominated by Hoka/On/Nike
# and not where ORUUN competes.

# Geographies to query Google Trends in. ISO codes or "" for worldwide.
# Keep this list SHORT (1-2 geos) to stay under the 30-min job timeout.
geos:
  - US
  # - GB

# Time window for trend pulls.
timeframe: "today 12-m"

# Geo used for the "related queries" pull
related_queries_geo: "US"

# Wikipedia title overrides (still used if brand cross-source ever re-enabled).
wikipedia_titles:
  "on": "On (running brand)"
  hoka: "Hoka One One"

reddit_post_limit: 75
reddit_comment_limit: 25
subreddits:
  - running
  - trailrunning
  - Marathon_Training
  - xxfitness

# === BRAND LIST ===
# Used by the buyer-intent classifier (to flag "branded" queries like
# "satisfy running shirt"). NOT used for individual brand tracking anymore.
brands:
  - oruun
  - nike
  - "on"
  - hoka
  - salomon
  - asics
  - brooks
  - new balance
  - saucony
  - adidas
  - lululemon
  - tracksmith
  - bandit
  - district vision
  - satisfy
  - janji
  - ciele
  - path projects
  - soar
  - patagonia
  - smartwool
  - darn tough        # premium running sock brand
  - feetures          # running sock brand
  - balega            # running sock brand
  - stance            # running sock brand
  - injinji           # toe sock brand
  - goodr             # running sunglasses + caps

# === KEYWORD TRACKING LISTS ===
# Focus categories: tees / tanks / shorts / socks / caps.

categories:

  product_category:           # 品类词 - the core apparel types
    - running shirt
    - running t shirt
    - running tee
    - long sleeve running shirt
    - running tank top
    - running singlet
    - running shorts
    - 5 inch running shorts
    - split running shorts
    - compression running shorts
    - 2 in 1 running shorts
    - running socks
    - no show running socks
    - merino running socks
    - running cap
    - running hat
    - trucker hat running

  competitor_keyword:         # 具体竞品商品 (apparel only - no shoes)
    - tracksmith van cortlandt singlet
    - tracksmith twilight tank
    - satisfy short distance shorts
    - satisfy running tee
    - bandit running shirt
    - nike dri fit running shirt
    - nike challenger shorts
    - lululemon fast and free shorts
    - patagonia airshed pullover
    - on running tee
    - janji aft tights
    - ciele alpcap
    - goodr running cap
    - darn tough running socks
    - balega running socks
    - feetures elite socks

  feature_material:           # 功能/材质 - what runners search for in apparel
    - merino wool running shirt
    - seamless running top
    - anti chafe running shorts
    - moisture wicking shirt
    - breathable running shorts
    - quick dry running tee
    - lightweight running singlet
    - recycled polyester running
    - bamboo running shirt
    - mesh running shorts
    - compression running socks
    - toe running socks
    - sun protection running shirt
    - cooling running shirt
    - sweat wicking cap

  use_case_persona:           # 场景/人群 - when/who wears this
    - city run outfit
    - marathon kit
    - hot weather running gear
    - cold weather running gear
    - summer running outfit
    - winter running outfit
    - rainy day running gear
    - women running tank top
    - men running shorts
    - track workout outfit
    - half marathon kit
    - ultra running kit
    - trail running shorts
    - treadmill running outfit
    - race day kit

# === TUNING ===
opportunity_weights:
  volume_floor: 5
  growth_window_weeks: 4
  saturation_epsilon: 1
