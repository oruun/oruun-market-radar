name: Weekly Market Radar Update

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - "keywords.yaml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # plenty of headroom — we now only run 2 fetchers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Google Autocomplete — most reliable signal. Run FIRST so even if
      # Trends times out, we still have the centerpiece data.
      # 11 variations × ~25 seeds × ~0.5s = ~140s of polite delay alone.
      - name: Fetch Google autocomplete suggestions
        timeout-minutes: 10
        run: python scripts/fetch_autocomplete.py
        continue-on-error: true

      # Google Trends — rate-limited but high-value. Best-effort.
      - name: Fetch Google Trends + related queries
        timeout-minutes: 20
        run: python scripts/fetch_trends.py
        continue-on-error: true

      # Belt-and-suspenders: ensure trends file exists for analyze.py
      - name: Ensure trends file exists
        if: always()
        run: |
          mkdir -p data
          if [ ! -s data/trends_raw.json ]; then
            echo '{"fetched_at": null, "timeframe": "today 12-m", "primary_geo": "US", "series": []}' > data/trends_raw.json
            echo "Wrote empty trends_raw.json scaffold."
          fi

      - name: Analyze
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze.py
        continue-on-error: true

      - name: Build dashboard data
        if: always()
        run: python scripts/build_dashboard_data.py

      # Generate 3 GEO-optimized blog drafts from this week's data.
      # Skips silently if ANTHROPIC_API_KEY secret is not set.
      - name: Generate blog drafts
        if: always()
        timeout-minutes: 4
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_blogs.py
        continue-on-error: true

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "oruun-radar-bot"
          git config user.email "actions@github.com"
          git add docs/data.json data/*.json data/snapshots/*.json blogs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%F)"
            git push
          fi
