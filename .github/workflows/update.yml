name: Weekly Market Radar Update

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - "keywords.yaml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # bumped from 30 — Trends + Wikipedia + GDELT need headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Google Trends is the most rate-limited source. Per-step timeout caps
      # its damage so the remaining 4 sources + analyze + commit always run.
      - name: Fetch Google Trends + related queries
        timeout-minutes: 18
        run: python scripts/fetch_trends.py
        continue-on-error: true

      # Belt-and-suspenders: if Trends step was killed mid-write, seed an empty
      # file so downstream analyze doesn't choke.
      - name: Ensure trends file exists
        if: always()
        run: |
          mkdir -p data
          if [ ! -s data/trends_raw.json ]; then
            echo '{"fetched_at": null, "timeframe": "today 12-m", "primary_geo": "US", "series": []}' > data/trends_raw.json
            echo "Wrote empty trends_raw.json scaffold."
          fi

      - name: Fetch Wikipedia pageviews
        timeout-minutes: 6
        run: python scripts/fetch_wikipedia.py
        continue-on-error: true

      - name: Fetch GDELT global news mentions
        timeout-minutes: 8
        run: python scripts/fetch_gdelt.py
        continue-on-error: true

      - name: Fetch Hacker News chatter
        timeout-minutes: 4
        run: python scripts/fetch_hackernews.py
        continue-on-error: true

      - name: Fetch Google autocomplete suggestions
        timeout-minutes: 4
        run: python scripts/fetch_autocomplete.py
        continue-on-error: true

      - name: Fetch Reddit (optional)
        timeout-minutes: 8
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch_reddit.py
        continue-on-error: true

      - name: Analyze
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze.py
        continue-on-error: true   # main() wraps in try/except; tolerate any leak

      - name: Build dashboard data
        if: always()              # run even if previous steps failed
        run: python scripts/build_dashboard_data.py

      - name: Commit refreshed data
        if: always()              # commit whatever partial data we got
        run: |
          git config user.name "oruun-radar-bot"
          git config user.email "actions@github.com"
          git add docs/data.json data/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%F)"
            git push
          fi
