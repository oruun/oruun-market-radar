name: Weekly Market Radar Update

on:
  # MANUAL TRIGGER ONLY. The cloud pipeline never runs by itself.
  #
  # Why: GitHub's runner IPs are rate-limited, so autocomplete/Trends fetches
  # fail in the cloud. When a cloud run failed, build_dashboard_data.py used to
  # fall back to the seed sample and the Commit step pushed it -- silently
  # overwriting your real data with the May 2026 seed (the "back to 5月6日" bug).
  #
  # All real weekly refreshes now happen locally via run_weekly.ps1 and are
  # pushed by hand. This workflow stays only as a manual fallback you can start
  # yourself from the Actions tab if you ever want to.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # plenty of headroom — we now only run 2 fetchers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Google Autocomplete — our ONLY data source now.
      # Reduced to 6 variations × ~63 seeds × ~0.8s = ~5 min total.
      # Trends was removed: GitHub Actions IPs are heavily rate-limited and
      # Trends has timed out every single run for 4 consecutive weeks.
      - name: Fetch Google autocomplete suggestions
        timeout-minutes: 12
        env:
          AUTOCOMPLETE_DEPTH: lean   # GHA IPs throttle; local runs use 'rich'
        run: python scripts/fetch_autocomplete.py
        continue-on-error: true

      # Always-write an empty trends scaffold so analyze.py doesn't error.
      - name: Stub empty Trends data
        if: always()
        run: |
          mkdir -p data
          echo '{"fetched_at": null, "timeframe": "today 12-m", "primary_geo": "US", "series": []}' > data/trends_raw.json

      - name: Analyze
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze.py
        continue-on-error: true

      - name: Build dashboard data
        if: always()
        run: python scripts/build_dashboard_data.py

      # Generate 3 GEO-optimized blog drafts from this week's data.
      # Skips silently if ANTHROPIC_API_KEY secret is not set.
      - name: Generate blog drafts
        if: always()
        timeout-minutes: 4
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_blogs.py
        continue-on-error: true

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "oruun-radar-bot"
          git config user.email "actions@github.com"
          git add docs/data.json data/*.json data/snapshots/*.json blogs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%F)"
            git push
          fi
